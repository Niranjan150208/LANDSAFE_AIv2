<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LANDSAFE AI – Sensors, Satellite and GIS Console</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
:root {
  --bg: #090e17;
  --card: #111a2e;
  --card-glass: rgba(17, 26, 46, 0.85);
  --tx: #f8fafc;
  --mu: #94a3b8;
  --bd: #1e2c47;
  --ac: #0ea5e9;
  --sf: #152238;
  --nav: #070c14;
  --pa: #0284c7;
  --pb: #38bdf8;
  --core: #ef4444;
  --buf: #f59e0b;
  --ok: #10b981;
  --gr: #64748b;
  --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
  --radius: 12px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6fa;
    --card: #ffffff;
    --card-glass: rgba(255, 255, 255, 0.9);
    --tx: #0f172a;
    --mu: #64748b;
    --bd: #e2e8f0;
    --ac: #0284c7;
    --sf: #edf2f7;
    --nav: #0f172a;
    --pa: #0284c7;
    --pb: #0ea5e9;
    --core: #dc2626;
    --buf: #d97706;
    --ok: #059669;
    --gr: #94a3b8;
    --shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.12);
  }
}
:root[data-theme="light"] {
  --bg: #f4f6fa;
  --card: #ffffff;
  --card-glass: rgba(255, 255, 255, 0.9);
  --tx: #0f172a;
  --mu: #64748b;
  --bd: #e2e8f0;
  --ac: #0284c7;
  --sf: #edf2f7;
  --nav: #0f172a;
  --pa: #0284c7;
  --pb: #0ea5e9;
  --core: #dc2626;
  --buf: #d97706;
  --ok: #059669;
  --gr: #94a3b8;
  --shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.08);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.12);
}
:root[data-theme="dark"] {
  --bg: #090e17;
  --card: #111a2e;
  --card-glass: rgba(17, 26, 46, 0.85);
  --tx: #f8fafc;
  --mu: #94a3b8;
  --bd: #1e2c47;
  --ac: #0ea5e9;
  --sf: #152238;
  --nav: #070c14;
  --pa: #0284c7;
  --pb: #38bdf8;
  --core: #ef4444;
  --buf: #f59e0b;
  --ok: #10b981;
  --gr: #64748b;
}

body[data-pg=map]{--pa:#0d9488;--pb:#2dd4bf}
body[data-pg=sens]{--pa:#0284c7;--pb:#38bdf8}
body[data-pg=sat]{--pa:#7c3aed;--pb:#a78bfa}
body[data-pg=alerts]{--pa:#ea580c;--pb:#fb923c}
body[data-pg=rng]{--pa:#ef4444;--pb:#f87171}
body[data-pg=rep]{--pa:#65a30d;--pb:#a3e635}
body[data-pg=src],body[data-pg=set]{--pa:#475569;--pb:#94a3b8}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); font-size: 14px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* Sidebar navigation */
aside {
  background: var(--nav);
  border-right: 1px solid var(--bd);
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.logo {
  padding: 0 4px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-img {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  object-fit: cover;
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
  border: 1px solid rgba(56, 189, 248, 0.3);
  flex-shrink: 0;
}
.logo-text b {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  color: #fff;
  display: block;
  line-height: 1.2;
}
.logo-text small {
  display: block;
  color: var(--mu);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
nav button {
  display: flex;
  gap: 12px;
  width: 100%;
  align-items: center;
  border: 0;
  background: transparent;
  color: var(--mu);
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  transition: all 0.15s ease;
  position: relative;
}
nav button:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}
nav button.on {
  background: linear-gradient(90deg, rgba(56, 189, 248, 0.15), rgba(56, 189, 248, 0.03));
  color: #fff;
  font-weight: 600;
  box-shadow: inset 3px 0 0 var(--pb);
}
nav i {
  font-style: normal;
  width: 20px;
  text-align: center;
  font-size: 15px;
  opacity: 0.9;
}

.who {
  margin-top: auto;
  padding: 14px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 10px;
  font-size: 12px;
  color: var(--mu);
}
.who b { color: var(--tx); }
.who .b {
  margin-top: 8px;
  width: 100%;
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--tx);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
}
.who .b:hover {
  background: rgba(239, 68, 68, 0.15);
  border-color: #ef4444;
  color: #fca5a5;
}

/* Main workspace */
main {
  padding: 18px 24px 40px;
  min-width: 0;
}

/* Card base */
.card {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 16px 18px;
  position: relative;
  box-shadow: var(--shadow);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.card h3 {
  margin: 0 0 12px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Top control header */
.top {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 16px;
  align-items: center;
  margin-bottom: 16px;
  background: linear-gradient(135deg, var(--card), var(--sf));
  border: 1px solid var(--bd);
}
.top label {
  font-weight: 600;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.top label b {
  color: var(--ac);
  font-family: ui-monospace, "SF Mono", monospace;
  font-size: 14px;
}
.top input[type=range] {
  width: 160px;
  accent-color: var(--ac);
  cursor: pointer;
}

/* Grids & layouts */
.g { display: grid; gap: 14px; margin-bottom: 14px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 14px; }

/* Buttons & Inputs */
button.b, select {
  font: inherit;
  color: var(--tx);
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 7px 14px;
  cursor: pointer;
  min-height: 36px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
}
button.b:hover {
  background: var(--bd);
  border-color: rgba(255, 255, 255, 0.2);
}
button.p {
  background: linear-gradient(135deg, var(--pa), var(--pb));
  color: #fff;
  border: 0;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(14, 165, 233, 0.35);
}
button.p:hover {
  filter: brightness(1.12);
  box-shadow: 0 4px 14px rgba(14, 165, 233, 0.45);
}
button[aria-pressed=true] {
  border-color: var(--ac);
  background: rgba(14, 165, 233, 0.15);
  color: var(--ac);
  font-weight: 600;
}
button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
input.t, #lg input {
  width: 100%;
  font: inherit;
  color: var(--tx);
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 8px 12px;
  margin: 4px 0 10px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
input.t:focus, #lg input:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
}

/* Hero banner */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 16px;
  color: #fff;
  background: linear-gradient(135deg, #0e1d2b 0%, #15293d 100%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: var(--shadow);
}
.hero::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--pa), var(--pb));
}
.hero h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.3px;
  position: relative;
}
.hero p {
  margin: 6px 0 0;
  max-width: 620px;
  position: relative;
  opacity: 0.9;
  font-size: 13.5px;
  color: #cbd5e1;
}
.hero .ic {
  position: absolute;
  right: 20px;
  top: 14px;
  font-size: 42px;
  opacity: 0.75;
}
.hero .chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
  position: relative;
}
.chips span {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 3px 12px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 500;
  color: #e2e8f0;
}
.hero .rain {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(105deg, transparent 45%, rgba(56, 189, 248, 0.25) 50%, transparent 55%);
  background-size: 24px 40px;
  opacity: 0.3;
  animation: rn 1.2s linear infinite;
  pointer-events: none;
}
@keyframes rn { to { background-position: -24px 40px; } }

/* Stats HUD */
.stat {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.stat b {
  font-size: 28px;
  font-weight: 700;
  font-family: ui-monospace, "SF Mono", monospace;
  letter-spacing: -0.5px;
  color: var(--tx);
  line-height: 1.2;
}
.stat span {
  color: var(--mu);
  font-size: 12px;
  font-weight: 500;
  margin-top: 4px;
}

/* Badges */
.bd {
  display: inline-flex;
  align-items: center;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.4px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

/* Tables */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--bd);
}
th {
  color: var(--mu);
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
tr.k { cursor: pointer; transition: background 0.15s ease; }
tr.k:hover { background: var(--sf); }
.sc { overflow-x: auto; }

/* Map Viewport */
.mapw {
  position: relative;
  aspect-ratio: 600 / 400;
  border-radius: var(--radius);
  overflow: hidden;
  margin: 10px 0;
  background: #060b13;
  border: 1px solid var(--bd);
  box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
}
.mapw canvas, .mapw svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.mapw::after {
  content: "N ▲";
  position: absolute;
  top: 10px;
  right: 12px;
  color: var(--mu);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  background: rgba(0,0,0,0.5);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.1);
  pointer-events: none;
}

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 12px; color: var(--mu); margin-top: 6px; line-height: 1.4; }

/* Factor items & gauges */
.fx {
  display: grid;
  grid-template-columns: 1.3fr 0.9fr 1fr;
  gap: 6px 12px;
  align-items: center;
  font-size: 13px;
  margin-bottom: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.02);
}
.fx small { display: block; color: var(--mu); font-size: 11.5px; }
.off { opacity: 0.45; }

.bar {
  height: 8px;
  background: var(--sf);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.bar i {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--pa), var(--pb));
}

.nd {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.nd div {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12px;
  color: var(--mu);
}
.nd b {
  display: block;
  font-size: 18px;
  font-family: ui-monospace, "SF Mono", monospace;
  color: var(--tx);
  margin: 2px 0;
}

.warn {
  border-left: 4px solid #f97316;
  background: rgba(249, 115, 22, 0.1);
  border: 1px solid rgba(249, 115, 22, 0.3);
  border-left-width: 4px;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}

.mini {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.mini canvas {
  width: 100%;
  aspect-ratio: 600 / 400;
  border-radius: 8px;
  display: block;
  border: 1px solid var(--bd);
}

/* Smartphone preview */
.phone {
  width: 260px;
  margin: 10px auto;
  border: 8px solid #1e293b;
  border-radius: 32px;
  padding: 16px 12px;
  min-height: 200px;
  background: var(--bg);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  position: relative;
}
.phone::before {
  content: "";
  display: block;
  width: 60px;
  height: 4px;
  background: #334155;
  border-radius: 99px;
  margin: 0 auto 12px;
}
.sms {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12.5px;
  line-height: 1.4;
  white-space: pre-line;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}
.sms small {
  display: block;
  color: var(--ac);
  font-weight: 600;
  margin-bottom: 4px;
  font-size: 11px;
}
.phone .sms + .sms { margin-top: 8px; }

.al {
  border-left: 4px solid;
  padding: 10px 14px;
  margin-bottom: 8px;
  background: var(--sf);
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  transition: transform 0.1s ease;
}
.al:hover { transform: translateX(2px); }

/* Radar pulse animation */
.pulse {
  animation: pl 2s cubic-bezier(0, 0, 0.2, 1) infinite;
  transform-origin: center;
}
@keyframes pl {
  0% { opacity: 0.8; stroke-width: 2px; }
  50% { opacity: 0.25; stroke-width: 1px; }
  100% { opacity: 0.05; stroke-width: 0.5px; }
}

/* Responsive */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside { position: static; height: auto; padding: 12px 14px; }
  nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  nav button { white-space: nowrap; width: auto; padding: 8px 12px; }
  .split { grid-template-columns: 1fr; }
  main { padding: 14px 12px; }
}

/* Login Modal */
#lg {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(6, 11, 19, 0.88);
  backdrop-filter: blur(16px);
  overflow: auto;
}
#lg.h { display: none; }
#lg select { width: 100%; margin: 4px 0 10px; }
#lg .card {
  width: 100%;
  max-width: 400px;
  padding: 28px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: linear-gradient(145deg, #10192b, #0c1424);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
}
.lg-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.lg-logo-img {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
  border: 1.5px solid rgba(56, 189, 248, 0.35);
  flex-shrink: 0;
}
#lg h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: linear-gradient(90deg, #fff, #93c5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
#lg label, .card label {
  font-size: 12px;
  color: var(--mu);
  display: block;
  font-weight: 500;
}
.err {
  color: #ef4444;
  min-height: 18px;
  font-size: 12.5px;
  font-weight: 600;
  margin-top: 4px;
}
.dm { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.dm .b {
  flex: 1;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  background: rgba(56, 189, 248, 0.08);
  border-color: rgba(56, 189, 248, 0.2);
  color: #7dd3fc;
  border-radius: 6px;
}
.dm .b:hover {
  background: rgba(56, 189, 248, 0.2);
  color: #fff;
}

.spark {
  width: 100%;
  height: 70px;
  background: var(--sf);
  border-radius: 8px;
  border: 1px solid var(--bd);
}
.live {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #10b981;
  margin-right: 8px;
  box-shadow: 0 0 8px #10b981;
  animation: pl 1.6s infinite;
}

/* Range & Area Safety view */
.ar-ctl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px 20px;
  margin-bottom: 14px;
}
.ar-ctl label { font-size: 13px; color: var(--mu); display: block; }
.ar-ctl b { color: var(--tx); font-family: ui-monospace, "SF Mono", monospace; }
.ar-ctl input[type=range] { width: 100%; accent-color: var(--ac); }
.ar-ctl select { width: 100%; margin-top: 6px; }

.ar-mapw {
  aspect-ratio: 3 / 2;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--sf);
  border: 1px solid var(--bd);
}
.ar-mapw svg { width: 100%; height: 100%; display: block; }
.ar-mapw svg text { fill: var(--tx); font-size: 12px; font-weight: 600; }

.ar-g2e { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.ar-g2e .phone { width: 100%; max-width: 320px; }

.ar-kp {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.ar-kp div {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--mu);
}
.ar-kp b {
  display: block;
  font-size: 22px;
  font-family: ui-monospace, "SF Mono", monospace;
  color: var(--tx);
  margin-top: 2px;
}

.ar-tile {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 12px 14px;
}
.ar-tile b { font-size: 16px; display: block; }

.ar-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 8px;

if((v=num('ndvi'))!=null){z.nv=Math.max(-.1,Math.min(1,v));mark(z,'nv','Sentinel-2 feed')}
if((v=num('insar_mm'))!=null){z.iv=Math.max(0,v);mark(z,'iv','Sentinel-1 feed')}
if((v=num('slope_deg'))!=null){z.sl=Math.max(1,Math.min(70,v));mark(z,'sl','DEM feed')}
if((v=num('elevation_m'))!=null)z.el=v;
if((v=num('soil_pct'))!=null){z.soil=Math.max(5,Math.min(95,v));mark(z,'so','Open-Meteo soil moisture')}
if((v=num('past_slides'))!=null){z.h=Math.max(0,Math.round(v));mark(z,'h','Slide catalog feed')}});
if(!n)throw new Error('no row matched a zone name');realMode();lg(label+': '+n+' zone(s) updated.',1);update()}
async function pullFeed(){const u=(S.fu||'').trim();if(!u)return $('fu').focus();try{const j=await getJ(u);applyFeed(Array.isArray(j)?j:j.zones||[],'Feed')}catch(x){lg('Feed failed: '+x.message,0)}}
async function fileFeed(f){if(!f)return;try{const t=await f.text();let rows;if(/\.json$/i.test(f.name)){const j=JSON.parse(t);rows=Array.isArray(j)?j:j.zones||[]}else rows=csv(t);applyFeed(rows,f.name)}catch(x){lg(f.name+': '+x.message,0)}}

/* Historical landslide catalog: count events within 25 km of each zone. */
async function fileCat(f){if(!f)return;try{const R=csv(await f.text()).map(r=>[parseFloat(r.latitude||r.lat),parseFloat(r.longitude||r.lon||r.lng)]).filter(p=>isFinite(p[0])&&isFinite(p[1]));if(!R.length)throw new Error('needs latitude and longitude columns');
Z.forEach((z,i)=>{z.h=R.filter(p=>hav(D[i][2],D[i][3],p[0],p[1])<=25).length;mark(z,'h','Landslide catalog')});realMode();lg(f.name+': '+R.length+' events read, counted within 25 km of each zone.',1);update()}catch(x){lg(f.name+': '+x.message,0)}}

function resetSrc(){Z.forEach((z,i)=>{z.rain=D[i][4];z.sl=D[i][6];z.h=D[i][7];z.nv=z.iv=z.el=undefined;z.live={}});lg('All sources back to demo values.',1);update()}

(function(){
const $=id=>document.getElementById(id);
const ZN=Z.map(z=>z.n);
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const V=Array.from({length:70},()=>({d:.5+Math.sqrt(rnd())*21,a:rnd()*6.283,p:40+Math.round(rnd()*560),al:null}));
const A={z:8,r:5,m:2,on:0,t:0,sm:94,mv:14,rain:1,auto:0,lang:'en',log:[],feed:[]};
const ext=()=>+(A.r*A.m).toFixed(1),ring=v=>v.d<=A.r?'c':v.d<=ext()?'b':'o',f=n=>n.toLocaleString();
const st=()=>{const c=A.mv>3||A.sm>85?'unsafe':A.mv>1||A.sm>70?'assess':'safe';return{c,b:c=='unsafe'?'ready':c=='assess'?'watch':'safe'}};
const C={unsafe:'var(--core)',assess:'var(--buf)',safe:'var(--ok)',ready:'var(--buf)',watch:'var(--buf)'};

const T={en:{pre:'UPDATE +{t} h, {z}: ',

pb:'LANDSAFE ALERT: A landslide is confirmed within {r} km of {z}. Danger may spread out to {e} km, and you are inside that range. Be ready: 1) Keep shoes, torch, phone and documents together. 2) Move away from steep slopes, road cuttings and streams. 3) Cracks, muddy water or tilting trees mean leave at once. 4) Wait for our next update.',

pc:'लैंडसेफ चेतावनी: {z} के पास भूस्खलन की पुष्टि हुई है। आप {r} किमी के खतरे वाले क्षेत्र में हैं। 1) तुरंत पैदल निकलें, भूस्खलन के रास्ते से किनारे होकर ऊँची, मज़बूत ज़मीन पर जाएँ। 2) नालों या खड्डों में नीचे न उतरें। 3) सामान लेने वापस न जाएँ। 4) बच्चों और बुज़ुर्गों की मदद करें। फँस जाएँ तो 112 पर कॉल करें।',
pb:'लैंडसेफ चेतावनी: {z} से {r} किमी के भीतर भूस्खलन की पुष्टि हुई है। खतरा {e} किमी तक फैल सकता है और आप उसी दायरे में हैं। तैयार रहें: 1) जूते, टॉर्च, फ़ोन और कागज़ात साथ रखें। 2) तीखी ढलानों, सड़क कटानों और नालों से दूर रहें। 3) दरारें, गंदा पानी या झुकते पेड़ दिखें तो तुरंत निकलें। 4) अगले अपडेट का इंतज़ार करें।',
uc:{unsafe:'यह क्षेत्र रहने के लिए सुरक्षित नहीं है। घर न लौटें, राहत शिविर में रहें।',assess:'जाँच जारी है। अभी वापस न लौटें, अधिकारी ढलानों की जाँच कर रहे हैं।',safe:'क्षेत्र लौटने के लिए सुरक्षित घोषित। नई दरारें दिखें तो रिपोर्ट करें।'},
ub:{ready:'सतर्क रहें और निकलने के लिए तैयार रहें। क्षेत्र अभी सुरक्षित घोषित नहीं है।',watch:'खतरा कम हो रहा है। तैयार रहें, सावधानी से घर पर रह सकते हैं।',safe:'क्षेत्र रहने के लिए सुरक्षित है। सामान्य जीवन शुरू कर सकते हैं।'}}};
const fill=s=>s.replace(/{z}/g,ZN[A.z]).replace(/{r}/g,A.r).replace(/{e}/g,ext()).replace(/{t}/g,A.t);
const num=x=>x.replace(/ (?=\d\) )/g,'\n').replace(/^(\d)\) /gm,'$1. '),msg=(kind,k)=>{const L=T[A.lang];return kind=='p'?num(fill(k=='c'?L.pc:L.pb)):fill(L.pre+(k=='c'?L.uc:L.ub)[st()[k]])};

function send(kind){['c','b'].forEach(k=>{const vs=V.filter(v=>ring(v)==k&&(kind=='u'||v.al!==k));if(!vs.length)return;vs.forEach(v=>v.al=k);A.log.unshift({t:A.t,k,kind,n:vs.length,p:vs.reduce((a,v)=>a+v.p,0),m:msg(kind,k)})});A.log=A.log.slice(0,10)}
const feed=()=>{A.feed.unshift({t:A.t,...st(),r:A.r,e:ext()});A.feed=A.feed.slice(0,8)};
function doConfirm(){A.on=1;A.sd=0;A.t=0;A.sm=94;A.mv=14;A.log=[];A.feed=[];V.forEach(v=>v.al=null);send('p');feed();note('Landslide confirmed near '+ZN[A.z]+': safety steps sent to '+f(people())+' people within '+ext()+' km',3);refresh()}
function tick(){if(!A.on)return;A.t+=3;A.sm=Math.max(40,Math.min(100,A.sm+(A.rain?2:-4)));A.mv=+(A.rain?A.mv*1.04:A.mv*.62).toFixed(1);feed();send('u');if(st().c=='safe'&&!A.sd){A.sd=1;note('Danger zone declared safe to live in after '+A.t+' h',0)}refresh()}
function widen(){A.r=Math.min(12,A.r+2);if(A.on){send('p');note('Danger range widened to '+A.r+' km, warning range now '+ext()+' km',2)}lab()}
function reset(){A.on=0;A.t=0;A.sm=94;A.mv=14;A.log=[];A.feed=[];V.forEach(v=>v.al=null);refresh()}

function map(){const vr=Math.max(12,ext()*1.12),k=190/vr,s=st();
let h='<svg viewBox="0 0 600 400" role="img" aria-label="Map of villages inside and outside the danger rings">';
h+=`<circle cx="300" cy="200" r="${ext()*k}" fill="var(--buf)" fill-opacity=".13" stroke="var(--buf)" stroke-width="2" stroke-dasharray="6 5"/>`;

V.forEach(v=>{if(v.d>vr)return;const x=300+Math.cos(v.a)*v.d*k,y=200+Math.sin(v.a)*v.d*k,g=ring(v),col=g=='o'?'var(--gr)':A.on?C[s[g]]:g=='c'?'var(--core)':'var(--buf)';
h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2.5+Math.sqrt(v.p)/10).toFixed(1)}" fill="${col}" fill-opacity="${g=='o'?.55:.95}" stroke="var(--card)" stroke-width="1"/>`});
h+=`<path d="M300 187l11 20h-22z" fill="var(--tx)"/><text x="300" y="${Math.max(14,200-A.r*k-6)}" text-anchor="middle">danger ${A.r} km</text><text x="300" y="${Math.max(14,200-ext()*k+15)}" text-anchor="middle">warning ${ext()} km</text></svg>`;return h}

function rng(){const grp=k=>{const a=V.filter(v=>ring(v)==k);return[a.length,a.reduce((x,v)=>x+v.p,0)]},[c,b,o]=['c','b','o'].map(grp);
return `<h3>Who gets alerted</h3><table><tr><th>Ring</th><th>Reach</th><th>Villages</th><th>People</th><th>Message</th></tr>
<tr><td><i class="ar-dot" style="background:var(--core)"></i>Confirmed danger</td><td>0 to ${A.r} km</td><td>${c[0]}</td><td>${f(c[1])}</td><td>Leave now</td></tr>
<tr><td><i class="ar-dot" style="background:var(--buf)"></i>Wider warning</td><td>${A.r} to ${ext()} km</td><td>${b[0]}</td><td>${f(b[1])}</td><td>Be ready</td></tr>
<tr><td><i class="ar-dot" style="background:var(--gr)"></i>Outside</td><td>beyond ${ext()} km</td><td>${o[0]}</td><td>${f(o[1])}</td><td>No alert</td></tr></table>
<p>Danger is confirmed out to <b>${A.r} km</b>, but a slide can spread past what sensors have confirmed. So the <b>${f(b[1])} people</b> between ${A.r} and ${ext()} km are warned now, before the danger reaches them.</p>
<p class="note">Widening the range, or moving either slider after a slide is confirmed, sends the right message to every village that newly falls inside a ring.</p>`}

function pre(){const ph=(k,t)=>{const L=msg('p',k).split('\n');return `<div class="phone"><small class="note">${A.on?'Sent to':'Preview for'} ${t}</small><div class="sms">${L[0]}</div>${L.slice(1).map(x=>`<div class="sms">${x}</div>`).join('')}</div>`};
return `<h3>Safety steps sent to people nearby</h3><div class="row">${[['en','English'],['hi','हिन्दी']].map(l=>`<button class="b" aria-pressed="${A.lang==l[0]}" onclick="AR.lang('${l[0]}')">${l[1]}</button>`).join('')}<span class="note">A live system sends in each phone’s language, including Assamese and Bengali.</span></div>
<div class="ar-g2e">${ph('c','people inside the '+A.r+' km danger range')}${ph('b','people between '+A.r+' and '+ext()+' km')}</div>`}

<div class="ar-g2e" style="margin-top:0">${tile('c','Inside '+A.r+' km')}${tile('b',A.r+' to '+ext()+' km')}</div>
${pro()&&A.rain&&A.mv>=16?`<div class="warn"><b>Ground is still moving and rain continues.</b> The slide may grow past ${A.r} km.<br><button class="b p" onclick="AR.widen()">Widen danger range by 2 km</button></div>`:''}
<h3 style="margin-top:14px">Updates sent every 3 hours</h3>${A.feed.map(x=>`<div class="al" style="border-color:${C[x.c]}"><b>+${x.t} h</b> inside ${x.r} km: ${LB[x.c]}<br>${x.r} to ${x.e} km: ${LB[x.b]}</div>`).join('')}`}

function out(){return `<h3>Messages sent (${A.log.length})</h3>`+(A.log.length?A.log.map(l=>`<div class="al" style="border-color:${l.k=='c'?'var(--core)':'var(--buf)'}"><b>+${l.t} h, ${l.kind=='p'?'safety steps':'status update'}</b> to ${l.n} villages, ${f(l.p)} people (${l.k=='c'?'danger range':'wider warning'})<br><span class="note">${l.m.slice(0,115)}…</span></div>`).join(''):'<p class="note">Nothing sent yet.</p>')}


const people=()=>V.filter(v=>ring(v)!='o').reduce((a,v)=>a+v.p,0),note=(m,lv)=>addA(Z[A.z],m,lv);

<label class="row"><input type="checkbox" ${A.rain?'checked':''} onchange="AR.rain(this.checked)"> Rain continues</label><label class="row"><input type="checkbox" ${A.auto?'checked':''} onchange="AR.auto(this.checked)"> Update every 3 s</label><button class="b" onclick="AR.reset()">Reset</button></div></div>`;
return ctl+`<div class="ar-split" style="margin-bottom:12px"><div class="card"><div class="ar-mapw" id="ar_map">${map()}</div><div class="note" style="margin-top:8px">Triangle is the landslide. Red ring: confirmed danger range. Dashed amber ring: wider warning range. Each dot is a village, sized by population. After a slide is confirmed, dot colours show that village’s current safety status.</div></div><div class="card sc" id="ar_rng">${rng()}</div></div>
<div class="card" id="ar_pre" style="margin-bottom:12px">${pre()}</div><div class="split"><div class="card" id="ar_sta">${sta()}</div><div class="card" id="ar_out">${out()}</div></div>`}
setInterval(()=>{if(A.auto)tick()},3000);
window.AR={page,confirm:doConfirm,tick,widen,reset,zone:v=>{A.z=+v;refresh()},r:v=>{A.r=+v;lab()},m:v=>{A.m=+v;lab()},chg:()=>{if(A.on){send('p');refresh()}},rain:c=>{A.rain=+c},auto:c=>{A.auto=+c},lang:l=>{A.lang=l;refresh()}};
})();
PG.splice(6,0,['rng','Alert Range','◎']);['Admin','Field Officer','Public'].forEach(r=>RP[r].push('rng'));
HERO.rng=['🚨','Alert range and area safety','Safety steps for people nearby, a wider warning ring beyond the confirmed danger range, and regular updates on whether the area is safe to live in.',['Safety steps','Wider warning ring','Safe-to-live updates']];
P.rng=()=>AR.page();
</script></body></html>
